name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-cpu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run CPU smoke tests (interpret=True)
        run: |
          pytest tests/test_gdn2_full_math_correctness.py -v --tb=short
        env:
          JAX_PLATFORMS: cpu
          GDN2_FWD_DIAG: "0"

      - name: Run remaining unit tests
        run: |
          pytest tests/test_configs.py tests/test_reference.py tests/test_imports.py tests/test_clip_config_plumbing.py tests/test_pallas.py -v --tb=short
        env:
          JAX_PLATFORMS: cpu

      - name: Run CPU-fast mini deep-correctness subset
        run: |
          python tests/extended/test_gdn2_deep_correctness_mini.py
        env:
          JAX_PLATFORMS: cpu
