name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAX_PLATFORMS: cpu
  OMP_NUM_THREADS: "1"

jobs:
  test-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "jax[cpu]==0.11.2" "jaxlib==0.11.2"
          pip install -e ".[dev]"

      - name: Run CPU smoke tests (interpret=True)
        run: |
          pytest tests/test_gdn2_full_math_correctness.py -v --tb=short
        env:
          JAX_PLATFORMS: cpu
          GDN2_FWD_DIAG: "0"

      - name: Run remaining unit tests
        run: |
          pytest tests/test_configs.py tests/test_reference.py tests/test_imports.py tests/test_clip_config_plumbing.py tests/test_pallas.py -v --tb=short
        env:
          JAX_PLATFORMS: cpu

      - name: Run CPU-fast mini deep-correctness subset
        run: |
          python tests/extended/test_gdn2_deep_correctness_mini.py
        env:
          JAX_PLATFORMS: cpu

      - name: Development reference oracle (no TPU timing)
        run: python benchmarks/honest_gdn2.py --allow-cpu-oracle

  test-atomic-gdn2:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "jax[cpu]==0.11.2" "jaxlib==0.11.2" \
                      "numpy==2.1.0" "scipy==1.15.0" \
                      "flax==0.12.9" "optax==0.2.8" \
                      pytest pytest-xdist
          pip install -e .
      - name: Run atomic_gdn2 tests
        run: pytest tests_gdn2/ -v -m "not slow" -c pytest_gdn2.ini
